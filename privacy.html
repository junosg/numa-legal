<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Numa — Privacy Policy has moved</title>

  <!-- This page is retired. It now forwards to the current policy on
       numaapps.com, which is the address shipped inside the app.

       The forward matters rather than being tidy-up: the version of this page
       that stood here until now gave a contact address for privacy questions
       that is no longer monitored. A privacy policy that hands a user a dead
       address is worse than one they cannot reach at all, and this URL is
       still reachable from older Play listings, from search results and from
       anyone's bookmarks. (The old address is deliberately not repeated here
       -- the point of this page is to stop it circulating.)

       GitHub Pages serves static files and cannot issue a 301, so this is a
       meta refresh plus a canonical link, with a visible link underneath for
       anyone whose browser honours neither. -->
  <meta http-equiv="refresh" content="0; url=https://numaapps.com/pos/privacy/">
  <link rel="canonical" href="https://numaapps.com/pos/privacy/">

  <style>
    :root { --ink:#021539; --muted:#5b6472; --accent:#1674f5; --bg:#f5f8ff; --card:#fff; --line:#e4ebf6; }
    * { box-sizing: border-box; }
    body {
      margin:0; background:var(--bg); color:var(--ink);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
      line-height:1.65;
    }
    .wrap { max-width:640px; margin:0 auto; padding:64px 20px 80px; }
    header { display:flex; align-items:center; gap:12px; margin-bottom:24px; }
    .logo { width:40px; height:40px; border-radius:10px; background:var(--accent); color:#fff;
      display:flex; align-items:center; justify-content:center; font-weight:800; font-size:18px; }
    h1 { font-size:26px; margin:0 0 12px; }
    p { color:var(--muted); margin:0 0 20px; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:28px; }
    a.go { display:inline-block; background:var(--accent); color:#fff; text-decoration:none;
      font-weight:700; padding:12px 20px; border-radius:10px; }
    a.plain { color:var(--accent); word-break:break-all; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="logo">n</div>
      <strong>Numa</strong>
    </header>
    <div class="card">
      <h1>This page has moved</h1>
      <p>
        The Numa POS privacy policy now lives on numaapps.com. You should be
        taken there automatically.
      </p>
      <p><a class="go" href="https://numaapps.com/pos/privacy/">Read the privacy policy</a></p>
      <p>
        If nothing happens, open
        <a class="plain" href="https://numaapps.com/pos/privacy/">https://numaapps.com/pos/privacy/</a>
        — or write to
        <a class="plain" href="mailto:support@numaapps.com">support@numaapps.com</a>.
      </p>
    </div>
  </div>
</body>
</html>
